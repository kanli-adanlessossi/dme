# Reverse proxy Nginx — limitation de débit des endpoints publics (G-4, exigence 4.1).
#
# Conception (design.md, « G-4 — Emplacement de la limitation de débit ») : la
# limitation de débit vit AU REVERSE PROXY, sur `/api/public/*`, à 60 req/min/IP, et
# renvoie 429 au dépassement. Ce fichier est l'artefact prêt à déployer qui
# l'implémente. Le repli applicatif (SlowAPI, `backend/app/core/rate_limit.py`) couvre
# le cas « aucun proxy » (dev, tests, mono-instance) ; ici, c'est le proxy qui porte
# la limite en production.
#
# Ce proxy est AUSSI le point de terminaison TLS : c'est donc lui (et lui seul) qui
# doit poser `Strict-Transport-Security` (HSTS) — l'API ne le pose pas (design,
# « Frontière de responsabilité des en-têtes »). La configuration TLS (certificats,
# `listen 443 ssl`, redirection 80→443) et la directive HSTS sont esquissées ci-dessous
# en commentaire : elles RELÈVENT de ce composant mais débordent le périmètre de la
# tâche 4.1, qui ne vise que la limitation de débit.

# --- Zone de limitation de débit (partagée entre workers) -------------------------
#
# `limit_req_zone` déclare une zone mémoire partagée indexée par `$binary_remote_addr`
# (l'IP cliente, forme binaire compacte : ~16 octets/entrée en IPv6) :
#   - `zone=public_zone:10m` : 10 Mo ≈ ~160 000 IP suivies simultanément — large marge
#     pour un annuaire public ; ajuster si la cardinalité d'IP attendue est supérieure.
#   - `rate=60r/m` : 60 requêtes par minute et par IP (exigence 4.1 ; équivaut à 1 r/s
#     lissé). Nginx lisse par défaut : un `burst` (ci-dessous) autorise des rafales
#     courtes sans rejeter immédiatement.
#
# Doit être déclarée dans le contexte `http { ... }`.
limit_req_zone $binary_remote_addr zone=public_zone:10m rate=60r/m;

# Code de réponse au dépassement. Nginx renvoie 503 PAR DÉFAUT ; l'exigence 4.1 impose
# 429 (« Too Many Requests »). Ce réglage DOIT donc être positionné explicitement.
limit_req_status 429;

# Upstream de l'API FastAPI (uvicorn). Ajuster l'hôte/port au déploiement réel (nom de
# service compose/k8s, ou socket). Exemple pour la pile locale : le service `api:8000`.
upstream dme_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # --- TLS / HSTS (relèvent de CE composant ; hors périmètre de la tâche 4.1) ------
    # En production, ce bloc termine TLS et pose HSTS (l'API ne le pose pas) :
    #   listen 443 ssl http2;
    #   ssl_certificate     /etc/nginx/tls/fullchain.pem;
    #   ssl_certificate_key /etc/nginx/tls/privkey.pem;
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # avec une redirection 80 → 443. La tâche 4.1 ne couvre QUE la limitation de débit.

    # --- Endpoints publics : LIMITÉS (G-4) -------------------------------------------
    # Seul ce préfixe est soumis à la limite. `burst=30` tolère une rafale courte de 30
    # requêtes au-delà du rythme lissé (file d'attente) ; `nodelay` sert ces requêtes de
    # rafale immédiatement plutôt que de les espacer, tout en comptant toujours dans la
    # zone. `burst` est le levier configurable de tolérance aux pics légitimes (carte
    # qui déclenche plusieurs fetch au chargement) sans relâcher le plafond moyen de
    # 60 r/min/IP. Au-delà de la rafale, Nginx renvoie 429 (cf. `limit_req_status`).
    location /api/public/ {
        limit_req zone=public_zone burst=30 nodelay;

        proxy_pass http://dme_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Reste de l'API : NON limité par cette zone ----------------------------------
    # Les routes authentifiées (`/api/auth`, `/api/sync`, `/api/center`,
    # `/api/patients`, `/api/visits`, `/api/admin`) et `/health` ne passent PAS par
    # `limit_req zone=public_zone` : la limitation est strictement cantonnée au public
    # (design, Property 3). D'autres zones/limites peuvent leur être appliquées au
    # besoin, indépendamment de celle-ci.
    location /api/ {
        proxy_pass http://dme_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://dme_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
