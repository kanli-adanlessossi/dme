# Configuration Nginx de production du frontend (sous-tâche 3.2 — écart G-3).
#
# Ce serveur statique sert le build Vite (`dist/`) copié dans
# /usr/share/nginx/html et porte, conformément à `design.md` (Architecture +
# « G-3 — CSP applicative servie par Nginx ») :
#   (a) la CSP applicative riche (lui seul connaît les origines réelles
#       MapLibre + API ; l'API, elle, porte une CSP verrouillée — tâche 2) ;
#   (b) les en-têtes de sécurité `X-Content-Type-Options` / `X-Frame-Options`
#       (mêmes valeurs que le middleware API de la tâche 2, aucun conflit) ;
#   (c) le fallback SPA (try_files … /index.html) ;
#   (d) un cache court sur sw.js / manifest.webmanifest / index.html et un cache
#       long immuable sur les assets horodatés (/assets/…).
#
# HSTS n'est PAS posé ici : il relève du point de terminaison TLS (reverse proxy
# en prod), cf. tableau Architecture de `design.md`.

# --- Origines de déploiement (build-time, spécifiques au déploiement) --------
#
# ORIGINE_API : origine de l'API appelée par le frontend (VITE_API_URL). Défaut
# du projet (docker-compose / Dockerfile ARG) = http://localhost:8000, de sorte
# que l'image de prod locale fonctionne telle quelle. En déploiement réel, cette
# valeur DOIT être remplacée par l'origine effective de l'API (et documentée) :
# elle apparaît dans `connect-src` ci-dessous ET dans l'URL du collecteur de
# rapports CSP (Reporting-Endpoints).
#
# NOTE collecteur CSP : `report-to csp-endpoint` pointe vers
# http://localhost:8000/api/csp-report. La route backend `POST /api/csp-report`
# qui reçoit ces rapports est un élément backend distinct (G-2/G-3, hors
# sous-tâche 3.2) ; elle n'est PAS définie ici. La directive et l'en-tête sont
# néanmoins câblés pour que la CSP ne soit pas « aveugle » une fois le
# collecteur livré.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression basique des réponses texte.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # ------------------------------------------------------------------ #
    # CSP applicative concrète (sans joker — DoD 3.3).                    #
    #                                                                     #
    # connect-src : 'self' + origine API (fetch /api/sync|public|center). #
    # img-src     : data:/blob: pour tuiles raster/sprites + GeoJSON rendu#
    #               par MapLibre (le projet sert ses propres tuiles,      #
    #               « sans clé d'API » → aucune origine tierce requise).  #
    # style-src   : 'self' UNIQUEMENT — resserré (tâche 4.3). Le frontend #
    #               n'émet aucun style inline régi par `style-src` ; le   #
    #               CSS MapLibre est externe (/assets/*.css depuis 'self')#
    #               → 'unsafe-inline' retiré, pas de compromis MapLibre.  #
    # worker-src  : service worker (sw.js, vite-plugin-pwa) + web workers #
    #               MapLibre.                                             #
    # report-to   : groupe `csp-endpoint` défini par Reporting-Endpoints. #
    #                                                                     #
    # ------------------------------------------------------------------ #
    # DURCISSEMENT style-src — ENFORCING `style-src 'self'` (tâche 4.3).  #
    #                                                                     #
    # Inventaire 4.1 (statique) : le frontend n'émet AUCUN style inline   #
    # régi par `style-src` — `style={{…}}` = 0, `<style>` = 0, attribut   #
    # `style="…"` = 0. Les seules écritures `.style.*` (TogoMap.tsx :     #
    # labelElement + curseur canvas, et MapLibre en interne) passent par  #
    # l'API DOM `HTMLElement.style.*`, qui n'est PAS soumise à            #
    # `style-src`. Le CSS visuel de MapLibre vient de `maplibre-gl.css`,  #
    # extrait par Vite en `/assets/*.css` servi depuis 'self' → couvert   #
    # par `style-src 'self'`, pas par 'unsafe-inline'. L'inventaire a donc#
    # prédit ZÉRO violation `style-src` légitime après resserrement.      #
    #                                                                     #
    # Historique du durcissement :                                        #
    #   - 4.2 : étape fail-safe — on a émis EN PLUS un en-tête            #
    #     `Content-Security-Policy-Report-Only` resserré (`style-src      #
    #     'self'`) à côté de l'enforcing (qui gardait 'unsafe-inline'),   #
    #     pour détecter via `report-to csp-endpoint` toute violation sans #
    #     rien bloquer pendant la calibration.                            #
    #   - 4.3 (ici) : l'inventaire 4.1 ayant conclu que `style-src 'self'`#
    #     est sûr (aucune violation légitime attendue) et le Report-Only  #
    #     ayant joué son rôle de garde-fou, on bascule l'en-tête ENFORCING#
    #     `Content-Security-Policy` sur `style-src 'self'`. L'en-tête     #
    #     Report-Only, devenu identique à l'enforcing, est REDONDANT : il #
    #     est RETIRÉ (il ne protège plus de rien une fois l'enforcing     #
    #     resserré). Seul `Reporting-Endpoints` subsiste, pour que        #
    #     d'éventuelles violations enforcing soient toujours remontées.   #
    #   - 4.4 (repli conditionnel) : ÉVALUÉ, NON DÉCLENCHÉ. Le repli      #
    #     « conserver 'unsafe-inline' et documenter le résidu » ne        #
    #     s'applique QUE si un style légitime est bloqué sans contournement#
    #     propre. L'inventaire 4.1 (0 style inline régi par `style-src`)  #
    #     et le résultat 4.3 (aucun style légitime bloqué) n'ont révélé   #
    #     AUCUN résidu à assumer. DÉCISION RÉSOLUE : `style-src` resserré #
    #     à 'self' SANS résidu 'unsafe-inline'. Arbre de décision clos.   #
    #                                                                     #
    # CAVEAT empirique : l'inventaire statique (4.1) + le test de cohérence#
    # de config (`csp-consistency.test.ts`) verrouillent l'invariant au   #
    # niveau du fichier, mais la vérification DÉFINITIVE de non-régression #
    # de rendu est au DÉPLOIEMENT : exercer, contre un conteneur servant,  #
    # la carte MapLibre + les pages tenant + le login et confirmer ZÉRO   #
    # violation `style-src` remontée via `report-to csp-endpoint`. Un     #
    # fichier de config ne peut pas prouver seul l'absence de violation   #
    # runtime.                                                            #
    #                                                                     #
    # Invariant : l'en-tête `Content-Security-Policy` DOIT être IDENTIQUE #
    # sur les 4 blocs `location` (index/fallback, sw.js, manifest,        #
    # assets) — un écart = trou silencieux. Vérifié automatiquement par   #
    # `src/lib/csp-consistency.test.ts` (tâche 4.3).                      #
    # ------------------------------------------------------------------ #

    # Fallback SPA : les routes client résolvent vers l'app shell.
    # Les en-têtes de sécurité / CSP / cache sont posés par bloc de location ;
    # rappel : `add_header` n'est PAS hérité dans un `location` qui redéfinit ses
    # propres `add_header` — ils sont donc répétés là où c'est nécessaire.
    location / {
        try_files $uri $uri/ /index.html;

        # En-têtes de sécurité (document HTML et navigation SPA).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8000; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; worker-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; report-to csp-endpoint" always;
        add_header Reporting-Endpoints "csp-endpoint=\"http://localhost:8000/api/csp-report\"" always;

        # Cache court : l'app shell (index.html, servi par ce bloc et le
        # fallback) doit être revalidée pour que les clients prennent vite les
        # nouveaux déploiements.
        add_header Cache-Control "no-cache" always;
    }

    # Service worker et manifeste : cache court impératif. Un sw.js périmé
    # bloquerait la prise en compte des nouveaux déploiements.
    location = /sw.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8000; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; worker-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; report-to csp-endpoint" always;
        add_header Reporting-Endpoints "csp-endpoint=\"http://localhost:8000/api/csp-report\"" always;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        # La carte MIME par défaut de nginx:alpine ne connaît pas `.webmanifest`
        # et le sert donc en `application/octet-stream`. On force le type correct
        # pour ce seul fichier (polish 3.4) sans toucher aux autres en-têtes.
        types { } default_type application/manifest+json;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8000; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; worker-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; report-to csp-endpoint" always;
        add_header Reporting-Endpoints "csp-endpoint=\"http://localhost:8000/api/csp-report\"" always;
        add_header Cache-Control "no-cache" always;
    }

    # Assets horodatés (hash dans le nom, émis par Vite sous /assets/) :
    # cache long immuable — un nouveau build change le nom de fichier.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8000; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; worker-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; report-to csp-endpoint" always;
        add_header Reporting-Endpoints "csp-endpoint=\"http://localhost:8000/api/csp-report\"" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        try_files $uri =404;
    }
}
