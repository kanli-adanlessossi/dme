# Configuration Alembic — migrations versionnées de la base (NFR-12).
#
# La DSN de connexion n'est PAS codée ici : `env.py` la lit depuis la
# configuration applicative (variables d'environnement POSTGRES_*). La clé
# `sqlalchemy.url` est volontairement laissée vide.

[alembic]
# Emplacement des scripts de migration.
script_location = alembic

# Gabarit de nommage des fichiers de version : horodatage + slug lisible.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Fuseau pour l'horodatage des noms de fichiers.
timezone = UTC

# La DSN est injectée dynamiquement par env.py (voir get_settings().database_url).
sqlalchemy.url =

[post_write_hooks]
# Formatage automatique des migrations générées via ruff.
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
