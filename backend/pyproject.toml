[project]
name = "dme-backend"
version = "0.1.0"
description = "Backend FastAPI de la plateforme multi-tenant de centres médicaux du Togo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "geoalchemy2>=0.15",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    # Repli applicatif de limitation de débit des endpoints publics (G-4, tâche 4.1).
    # Version épinglée : la conception place la limitation au reverse proxy, SlowAPI
    # n'en est que le repli « si aucun proxy » (rend le 429 reproductible/testable).
    "slowapi==0.1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    # Client HTTP du `TestClient` de Starlette. Starlette ≥ 1.7 privilégie
    # `httpx2` (successeur maintenu par l'organisation pydantic) et déprécie
    # l'emploi de l'ancien `httpx` ; on adopte donc `httpx2` pour une sortie de
    # test sans avertissement de dépréciation (G-8 / NFR-13). Le `TestClient` et
    # le client asynchrone direct de `test_health.py` l'utilisent.
    "httpx2>=2.13",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)`, `Query(...)`, etc. en valeur par défaut d'argument est le motif
# idiomatique FastAPI pour l'injection de dépendances ; on l'exempte de B008.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
# Garde-fou anti-régression des dépréciations (G-8 / NFR-13). La suite doit
# rester SANS avertissement de dépréciation : on les transforme donc en erreurs
# pour qu'une future dépréciation (dépendance montée de version, API retirée)
# fasse échouer la CI au lieu de passer inaperçue. On couvre à la fois les
# `DeprecationWarning`/`PendingDeprecationWarning` standards ET le
# `StarletteDeprecationWarning` de Starlette — qui hérite de `UserWarning`, pas
# de `DeprecationWarning`, et échapperait sinon au filtre. Aucun motif d'ignore
# n'est nécessaire : toutes les dépréciations observées (HTTP_422, testclient
# `httpx`→`httpx2`, clé HMAC courte) sont corrigées à la source.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "error::starlette.exceptions.StarletteDeprecationWarning",
]
